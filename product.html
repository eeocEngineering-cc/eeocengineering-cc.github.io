<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Product · EEOC</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>

<div id="topbar-placeholder"></div>

<div class="page-wrap">
  <a href="store.html" class="btn secondary" style="margin-bottom: 1.5rem;">&larr; Back to Store</a>

  <div class="content-box" id="productBox">
    <p>Loading product...</p>
  </div>
</div>

<!-- Lightbox -->
<div class="lightbox" id="lightbox">
  <button class="lightbox-close" id="lightboxClose">&times;</button>
  <img id="lightboxImg" src="" alt="">
</div>

<script async src="https://js.stripe.com/v3/buy-button.js"></script>
<script src="site.js"></script>
<script>
  loadTopbar("store");

  let currentSlide = 0;

  function moveCarousel(delta) {
    const track = document.getElementById("carouselTrack");
    const total = track.children.length;
    currentSlide = (currentSlide + delta + total) % total;
    track.style.transform = `translateX(-${currentSlide * 100}%)`;
    document.querySelectorAll(".carousel-dot").forEach((d, i) => {
      d.classList.toggle("active", i === currentSlide);
    });
  }

  function goToSlide(i) {
    const track = document.getElementById("carouselTrack");
    currentSlide = i % track.children.length;
    moveCarousel(0);
  }

  function getProductId() {
    return new URLSearchParams(window.location.search).get("id");
  }

  async function loadProduct() {
    const box = document.getElementById("productBox");
    const id = getProductId();
    if (!id) {
      box.innerHTML = "<p>No product specified.</p>";
      return;
    }
    try {
      const res = await fetch(`store/products/${id}.json`);
      if (!res.ok) throw new Error("not found");
      const p = await res.json();

      const imageTags = p.images
        .map((img) => `<img src="store/products/${p.id}/${img}" alt="${p.name}">`)
        .join("");

      const dotTags = p.images
        .map((_, i) => `<span class="carousel-dot${i === 0 ? " active" : ""}" onclick="goToSlide(${i})"></span>`)
        .join("");

      // Build static HTML for everything except the Stripe element
      box.innerHTML = `
        <div class="product-top">
          <div class="buy-box" id="buyBox">
            <h1>${p.name}</h1>
            <p class="product-price">${p.price}</p>
          </div>
          <div class="carousel">
            <div class="carousel-track" id="carouselTrack">${imageTags}</div>
            ${p.images.length > 1 ? `
              <button class="carousel-btn prev" onclick="moveCarousel(-1)">&#8249;</button>
              <button class="carousel-btn next" onclick="moveCarousel(1)">&#8250;</button>
            ` : ""}
          </div>
        </div>
        ${p.images.length > 1 ? `<div class="carousel-dots">${dotTags}</div>` : ""}
        <div class="md-content">
          <p>${p.description}</p>
        </div>
      `;

      // Create the Stripe element properly so its web component observer fires
      const stripeBtn = document.createElement("stripe-buy-button");
      stripeBtn.setAttribute("buy-button-id", p.stripe_buy_button_id);
      stripeBtn.setAttribute("publishable-key", p.stripe_publishable_key);
      document.getElementById("buyBox").appendChild(stripeBtn);
    } catch (err) {
      box.innerHTML = "<p>Couldn't find that product.</p>";
      console.error(err);
    }
  }

  loadProduct();

  // Lightbox
  const lightbox    = document.getElementById("lightbox");
  const lightboxImg = document.getElementById("lightboxImg");

  function openLightbox(src, alt) {
    lightboxImg.src = src;
    lightboxImg.alt = alt;
    lightbox.classList.add("open");
  }
  function closeLightbox() {
    lightbox.classList.remove("open");
  }

  // Wire up clicks on carousel images — delegated so it works after loadProduct() inserts them
  document.addEventListener("click", (e) => {
    if (e.target.closest(".carousel-track img")) {
      const img = e.target.closest("img");
      openLightbox(img.src, img.alt);
    }
  });

  document.getElementById("lightboxClose").addEventListener("click", closeLightbox);
  lightbox.addEventListener("click", (e) => { if (e.target === lightbox) closeLightbox(); });
  document.addEventListener("keydown", (e) => { if (e.key === "Escape") closeLightbox(); });
</script>
</body>
</html>
